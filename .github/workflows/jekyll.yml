# Build and deploy Junteng Liu's academic homepage to GitHub Pages.
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Verify personal homepage
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          grep -Fq 'jliugi@connect.ust.hk' _site/index.html
          grep -Fq 'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond' _site/index.html
          grep -Fq 'Composing Parameter-Efficient Modules with Arithmetic Operations' _site/index.html
          for slug in synlogic chart-understanding universal-truthfulness-hyperplane in-context-sharpness c-eval composing-parameter-efficient-modules; do
            test -f "_site/publications/$slug/index.html"
          done
          test ! -e _site/cv/index.html
          test ! -e _site/portfolio/index.html
          test ! -e _site/teaching/index.html
          test ! -e _site/talks/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
